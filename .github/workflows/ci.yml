name: Tests and synchronized API documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned environment and project
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Test production code and executable examples
        run: |
          python -m pytest --junitxml=results/generated/pytest_results.xml
          python -m doctest src/rul_project/prepare_dataset.py src/rul_project/rul_metrics.py src/rul_project/model_configuration.py
      - name: Check and regenerate API documentation
        run: |
          python tools/build_api_documentation.py --check
          python tools/build_api_documentation.py
          git diff --exit-code -- docs/api docs/source_manifest.json docs/project_guide.html START_HERE.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: results/generated/pytest_results.xml
