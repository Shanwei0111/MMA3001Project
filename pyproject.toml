[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mma3001-rul-project"
version = "1.0.0"
description = "Reproducible NASA C-MAPSS FD001 four-model RUL comparison"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{name = "Chua Shanwei"}]
dependencies = ["numpy==2.5.4", "pandas==3.1.0", "scipy==1.18.1", "scikit-learn==1.9.1", "matplotlib==3.11.2", "threadpoolctl==3.7.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pdoc==16.0.0"]

[project.scripts]
rul-project = "rul_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
